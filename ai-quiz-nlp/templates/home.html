<!DOCTYPE html>
<html>
<head>
<title>AI Quiz Generator</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
    background: #020617;
}

.logo {
    color: #38bdf8;
    font-size: 20px;
    font-weight: bold;
}

.nav-btn {
    background: #38bdf8;
    padding: 8px 15px;
    border-radius: 6px;
    color: black;
    text-decoration: none;
}

/* HERO SECTION */
.container {
    text-align: center;
    margin-top: 60px;
}

h1 {
    font-size: 40px;
    color: #38bdf8;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 20px;
}

/* FEATURES */
.features {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    width: 200px;
    box-shadow: 0 0 10px rgba(0,0,0,0.4);
}

.card:hover {
    transform: scale(1.05);
    transition: 0.3s;
}

.icon {
    font-size: 30px;
}

/* INPUT BOX */
.form-box {
    margin-top: 30px;
}

textarea {
    width: 50%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #020617;
    color: white;
}

button {
    margin-top: 15px;
    padding: 12px 20px;
    background: #22c55e;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #16a34a;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">🧠 AI Quiz</div>
    <a href="/" class="nav-btn">🏠 Home</a>
</div>

<!-- MAIN -->
<div class="container">

    <h1>🚀 AI Quiz Generator</h1>
    <p class="subtitle">Turn your notes into smart quizzes instantly</p>

    <!-- FEATURES -->
    <div class="features">

        <div class="card">
            <div class="icon">🤖</div>
            <p>AI Powered</p>
        </div>

        <div class="card">
            <div class="icon">📝</div>
            <p>Auto Questions</p>
        </div>

        <div class="card">
            <div class="icon">⏱</div>
            <p>Timed Quiz</p>
        </div>

        <div class="card">
            <div class="icon">🎯</div>
            <p>Instant Score</p>
        </div>

    </div>

    <!-- INPUT -->
    <div class="form-box">

        {% if error %}
        <p style="color:red;">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <textarea name="text" rows="6" placeholder="📄 Paste your study material here..."></textarea><br>
            <button type="submit">⚡ Generate Quiz</button>
        </form>

    </div>

</div>

</body>
</html>
